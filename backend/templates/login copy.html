<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In — CS Room Reservations</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Your existing global site styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body class="bg-light">
  <!-- THIN ACCENT STRIPE -->
  <div class="uo-green-stripe"></div>

  <!-- HEADER BAR MATCHING YOUR EMAIL TEMPLATE -->
  <header class="uo-green-header py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <span class="text-light">UO School of Computer & Data Science</span>
      <span class="text-light">CS Room Reservations</span>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container d-flex align-items-center justify-content-center" style="min-height: 75vh;">
    <div class="card login-card p-4" style="max-width: 420px; width: 100%;">
      <h2 class="h4 text-center mb-1">Welcome Back</h2>
      <p class="text-muted text-center mb-4">Sign in with your email to continue</p>

      <form id="loginForm" class="needs-validation" novalidate>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email</label>
          <input id="email" type="email" class="form-control" placeholder="@uoregon.edu" required>
          <div class="invalid-feedback">Please provide a valid UO email.</div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">Password</label>
          <input id="password" type="password" class="form-control" placeholder="••••••••" required>
          <div class="invalid-feedback">Password is required.</div>
        </div>

        <!-- Sign in button -->
        <a href="/login" class="btn btn-green px-3 py-1" style="font-size: 1rem;">
          Login
        </a>

      </form>

      <!-- Error message -->
      <div id="loginMsg" class="text-danger small mt-3" style="min-height: 1.25rem;"></div>

    </div>
  </main>

  <script>
    (function () {
      const form = document.getElementById('loginForm');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const msg = document.getElementById('loginMsg');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        form.classList.add('was-validated');
        if (!form.checkValidity()) return;

        msg.textContent = '';
        const body = { email: email.value.trim(), password: password.value };

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const data = await res.json().catch(() => ({}));

          if (!res.ok || data.ok === false) {
            msg.textContent = data.error || "Sign-in failed.";
            return;
          }

          const redirect = new URLSearchParams(window.location.search).get('to') || '{{ url_for("calendar_tab") }}';
          window.location.href = redirect;

        } catch (err) {
          console.error(err);
          msg.textContent = "Network error. Try again.";
        }
      });
    })();
  </script>

</body>
</html>
