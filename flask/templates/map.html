<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS Room Reservations - Map</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/map.css') }}" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

</head>

<body>
  <div class="container mt-4">
    <div class="row g-4 align-items-start">

      <!-- LEFT: Calendar -->
      <div class="col-md-3">
        <div id="calendar"></div>
        <div class="mt-3">
          <label for="calendarTime" class="form-label">Time</label>
          <input type="time" id="calendarTime" class="form-control" value="09:30">
        </div>
      </div>

      <!-- MIDDLE: Booking Widget -->
      <div class="col-md-4">
        <div class="booking-widget card shadow-sm p-3" style="width: 100%;">

          <!-- Room Selector -->
          <div class="room-header mb-3 dropdown d-flex align-items-center gap-2">
            <span id="selectedRoom" class="fw-semibold" style="font-size:1.3rem;">Room 120</span>
            <button class="btn p-0 border-0 bg-transparent edit-icon" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-pencil"></i>
            </button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#" onclick="document.getElementById('selectedRoom').textContent='Room 120'">Room 120</a></li>
              <li><a class="dropdown-item" href="#" onclick="document.getElementById('selectedRoom').textContent='Room 130'">Room 130</a></li>
              <li><a class="dropdown-item" href="#" onclick="document.getElementById('selectedRoom').textContent='Room 140'">Room 140</a></li>
              <li><a class="dropdown-item" href="#" onclick="document.getElementById('selectedRoom').textContent='Room 150'">Room 150</a></li>
            </ul>
          </div>

          <!-- Date -->
          <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date" value="{{ current_date }}">
          </div>

          <!-- Time Dropdown -->
          <div class="mb-3">
            <label class="form-label">Time</label>
            <div class="dropdown">
              <button class="btn btn-outline-secondary dropdown-toggle w-100" type="button" id="timeDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                Select a time
              </button>
              <ul class="dropdown-menu w-100" style="max-height: 300px; overflow-y: auto;">
                <!-- (Your full list of times unchanged) -->
                <li><a class="dropdown-item" href="#" onclick="document.getElementById('timeDropdown').textContent='8:00 AM - 8:30 AM'">8:00 AM - 8:30 AM</a></li>
                <li><a class="dropdown-item" href="#" onclick="document.getElementById('timeDropdown').textContent='8:30 AM - 9:00 AM'">8:30 AM - 9:00 AM</a></li>
                <li><a class="dropdown-item" href="#" onclick="document.getElementById('timeDropdown').textContent='9:00 AM - 9:30 AM'">9:00 AM - 9:30 AM</a></li>
                <!-- ... rest of time slots -->
              </ul>
            </div>
          </div>

          <!-- Repeat Dropdown -->
          <div class="mb-3 d-flex align-items-center gap-2">
            <label class="form-label mb-0">Does this booking repeat?</label>
            <div class="dropdown flex-grow-1">
              <button class="btn btn-outline-secondary dropdown-toggle w-100" type="button" id="repeatDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                Never
              </button>
              <ul class="dropdown-menu w-100">
                <li><a class="dropdown-item" href="#" onclick="document.getElementById('repeatDropdown').textContent='Never'">Never</a></li>
                <li><a class="dropdown-item" href="#" onclick="document.getElementById('repeatDropdown').textContent='Weekly'">Weekly</a></li>
                <li><a class="dropdown-item" href="#" onclick="document.getElementById('repeatDropdown').textContent='Monthly'">Monthly</a></li>
              </ul>
            </div>
          </div>

          <!-- Name -->
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" placeholder="Enter your name">
          </div>

          <!-- Purpose -->
          <div class="mb-3">
            <label for="purpose" class="form-label">Booking Purpose</label>
            <input type="text" class="form-control" id="purpose" placeholder="e.g. Study session, group meeting">
          </div>

          <!-- Submit -->
          <button class="btn btn-green w-100">Book Room</button>
        </div>
      </div>

      <!-- RIGHT: Floor Plan -->
      <div class="col-md-5 d-flex justify-content-end">
        <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel" style="max-width: 350px;">
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="{{ url_for('static', filename='map_images/deshutes_1.png') }}" class="d-block w-100" alt="Deshutes Floor 1">
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Your existing script unchanged -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');
      const dateInput = document.getElementById('date');
      const timeDropdown = document.getElementById('timeDropdown');
      const calendarTime = document.getElementById('calendarTime');

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        selectable: true,
        height: 'auto',
        dateClick: function(info) {
          const selectedDate = info.dateStr;
          dateInput.value = selectedDate;

          const t = calendarTime.value;
          const [hour, minute] = t.split(':');
          const hourNum = parseInt(hour);
          const isPM = hourNum >= 12;
          const formattedHour = hourNum % 12 || 12;
          const ampm = isPM ? 'PM' : 'AM';
          const displayTime = `${formattedHour}:${minute} ${ampm}`;
          timeDropdown.textContent = `${displayTime}`;
        }
      });

      calendar.render();

      calendarTime.addEventListener('change', function() {
        const t = this.value;
        const [hour, minute] = t.split(':');
        const hourNum = parseInt(hour);
        const isPM = hourNum >= 12;
        const formattedHour = hourNum % 12 || 12;
        const ampm = isPM ? 'PM' : 'AM';
        const displayTime = `${formattedHour}:${minute} ${ampm}`;
        timeDropdown.textContent = `${displayTime}`;
      });
    });
  </script>
</body>
</html>
