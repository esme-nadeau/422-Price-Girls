<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Room Reservations - Map</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .booking-widget {
            background: #fff;
            border: none;
            border-radius: 16px !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .booking-widget .form-control,
        .booking-widget select {
            border-radius: 10px;
        }

        .booking-widget .btn {
            border-radius: 10px;
        }

        .room-dropdown .dropdown-toggle {
            background: none;
            border: none;
            color: #000;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .room-dropdown .dropdown-toggle:focus {
            box-shadow: none;
        }

        .dropdown-menu {
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="booking-widget card shadow-sm p-3" style="width: 320px;">
        <!-- Room dropdown -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="dropdown room-dropdown">
                <button class="dropdown-toggle" type="button" id="roomDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    Room 120
                </button>
                <ul class="dropdown-menu" aria-labelledby="roomDropdown">
                    <li><a class="dropdown-item" href="#">Room 120</a></li>
                    <li><a class="dropdown-item" href="#">Room 130</a></li>
                    <li><a class="dropdown-item" href="#">Room 140</a></li>
                    <li><a class="dropdown-item" href="#">Room 150</a></li>
                </ul>
            </div>
        </div>

        <!-- Date -->
        <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date">
        </div>

        <!-- Time dropdown -->
        <div class="mb-3">
            <label for="time" class="form-label">Time</label>
            <select class="form-select" id="time">
                <option>8:00 AM - 8:30 AM</option>
                <option>8:30 AM - 9:00 AM</option>
                <option>9:00 AM - 9:30 AM</option>
                <option>9:30 AM - 10:00 AM</option>
                <option>10:00 AM - 10:30 AM</option>
                <option>10:30 AM - 11:00 AM</option>
                <option>11:00 AM - 11:30 AM</option>
                <option>11:30 AM - 12:00 PM</option>
                <option>12:00 PM - 12:30 PM</option>
                <option>12:30 PM - 1:00 PM</option>
                <option>1:00 PM - 1:30 PM</option>
                <option>1:30 PM - 2:00 PM</option>
                <option>2:00 PM - 2:30 PM</option>
                <option>2:30 PM - 3:00 PM</option>
                <option>3:00 PM - 3:30 PM</option>
                <option>3:30 PM - 4:00 PM</option>
                <option>4:00 PM - 4:30 PM</option>
                <option>4:30 PM - 5:00 PM</option>
            </select>
        </div>

        <!-- Repeat dropdown -->
        <div class="mb-3">
            <label class="form-label" for="repeat">Does this booking repeat?</label>
            <select class="form-select" id="repeat">
                <option value="Never">Never</option>
                <option value="Weekly">Weekly</option>
                <option value="Monthly">Monthly</option>
            </select>
        </div>

        <!-- Name -->
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" placeholder="Enter your name">
        </div>

        <!-- Purpose -->
        <div class="mb-3">
            <label for="purpose" class="form-label">Booking Purpose</label>
            <input type="text" class="form-control" id="purpose" placeholder="e.g. Study session, group meeting">
        </div>

        <!-- Submit -->
        <button class="btn w-100 text-white" style="background-color: #a3c4a1;">Book Room</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
