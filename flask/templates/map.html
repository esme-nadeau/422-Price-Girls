<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Room Reservations - Map</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/map.css') }}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</head>

<body>
    <div class="container mt-4">
        <div class="row">
            <!-- Left: Booking Widget -->
            <div class="col-md-4">
                <div class="booking-widget card shadow-sm p-3" style="width: 100%;">
                    <!-- Room dropdown -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="dropdown room-dropdown">
                            <button class="dropdown-toggle" type="button" id="roomDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                Room 120
                            </button>
                            <ul class="dropdown-menu" aria-labelledby="roomDropdown">
                                <li><a class="dropdown-item" href="#">Room 120</a></li>
                                <li><a class="dropdown-item" href="#">Room 130</a></li>
                                <li><a class="dropdown-item" href="#">Room 140</a></li>
                                <li><a class="dropdown-item" href="#">Room 150</a></li>
                            </ul>
                        </div>
                    </div>

                    <!-- Date -->
                    <div class="mb-3">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" class="form-control" id="date">
                    </div>

                    <!-- Time input (typed format xx:xx to xx:xx) -->
                    <div class="mb-3">
                        <label class="form-label" for="timeRange">Time</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="timeRange" 
                            placeholder="e.g. 09:00 to 11:30"
                            pattern="^([01]\d|2[0-3]):([0-5]\d)\s+to\s+([01]\d|2[0-3]):([0-5]\d)$"
                            title="Please enter a time range in the format HH:MM to HH:MM (e.g. 09:00 to 11:30)"
                            required
                        >
                    </div>


                    <!-- Repeat dropdown -->
                    <div class="mb-3">
                        <label class="form-label" for="repeat">Does this booking repeat?</label>
                        <select class="form-select" id="repeat">
                            <option value="Never">Never</option>
                            <option value="Weekly">Weekly</option>
                            <option value="Monthly">Monthly</option>
                        </select>
                    </div>

                    <!-- Name -->
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter your name">
                    </div>

                    <!-- Purpose -->
                    <div class="mb-3">
                        <label for="purpose" class="form-label">Booking Purpose</label>
                        <input type="text" class="form-control" id="purpose" placeholder="e.g. Study session, group meeting">
                    </div>

                    <!-- Submit -->
                    <button class="btn w-100 text-white" style="background-color: #a3c4a1;">Book Room</button>
                </div>
            </div>

            <!-- Right: Carousel -->
            <div class="col-md-8 d-flex justify-content-end">
                <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel" style="max-width: 350px;">
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
                    </div>

                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="{{ url_for('static', filename='map_images/deshutes_1.png') }}" 
                            class="d-block w-100" alt="Deshutes Floor 1">
                        </div>
                    </div>

                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>

                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
