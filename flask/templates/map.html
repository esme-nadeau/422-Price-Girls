<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Room Reservations - Map</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/map.css') }}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>

</head>

<body>
    <div class="container mt-4">
        <div class="row">
            <!-- Left: Booking Widget -->
            <div class="col-md-4">
                <div class="booking-widget card shadow-sm p-3" style="width: 100%;">
                    <!-- Room dropdown -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="dropdown room-dropdown">
                            <button class="dropdown-toggle" type="button" id="roomDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                Room 120
                            </button>
                            <ul class="dropdown-menu" aria-labelledby="roomDropdown">
                                <li><a class="dropdown-item" href="#">Room 120</a></li>
                                <li><a class="dropdown-item" href="#">Room 130</a></li>
                                <li><a class="dropdown-item" href="#">Room 140</a></li>
                                <li><a class="dropdown-item" href="#">Room 150</a></li>
                            </ul>
                        </div>
                    </div>

                    <!-- Date -->
                    <div class="mb-3">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" class="form-control" id="date">
                    </div>

                    <!-- Time selection using a multi-select -->
                    <div class="mb-3">
                        <label for="timeSelect" class="form-label">Select Time Slots</label>

                        <select id="timeSelect" class="form-select form-select-sm" multiple size="6" style="height:auto;">
                            <option value="08:00-08:30">08:00 AM – 08:30 AM</option>
                            <option value="08:30-09:00">08:30 AM – 09:00 AM</option>
                            <option value="09:00-09:30">09:00 AM – 09:30 AM</option>
                            <option value="09:30-10:00">09:30 AM – 10:00 AM</option>
                            <option value="10:00-10:30">10:00 AM – 10:30 AM</option>
                            <option value="10:30-11:00">10:30 AM – 11:00 AM</option>
                            <option value="11:00-11:30">11:00 AM – 11:30 AM</option>
                            <option value="11:30-12:00">11:30 AM – 12:00 PM</option>
                            <option value="12:00-12:30">12:00 PM – 12:30 PM</option>
                            <option value="12:30-13:00">12:30 PM – 01:00 PM</option>
                            <option value="13:00-13:30">01:00 PM – 01:30 PM</option>
                            <option value="13:30-14:00">01:30 PM – 02:00 PM</option>
                            <option value="14:00-14:30">02:00 PM – 02:30 PM</option>
                            <option value="14:30-15:00">02:30 PM – 03:00 PM</option>
                            <option value="15:00-15:30">03:00 PM – 03:30 PM</option>
                            <option value="15:30-16:00">03:30 PM – 04:00 PM</option>
                            <option value="16:00-16:30">04:00 PM – 04:30 PM</option>
                            <option value="16:30-17:00">04:30 PM – 05:00 PM</option>
                            <option value="17:00-17:30">05:00 PM – 05:30 PM</option>
                            <option value="17:30-18:00">05:30 PM – 06:00 PM</option>
                            <option value="18:00-18:30">06:00 PM – 06:30 PM</option>
                            <option value="18:30-19:00">06:30 PM – 07:00 PM</option>
                            <option value="19:00-19:30">07:00 PM – 07:30 PM</option>
                            <option value="19:30-20:00">07:30 PM – 08:00 PM</option>
                        </select>

                        <small class="form-text text-muted mt-1">
                            Click a start range, then Shift-click an end range to select all in-between.
                        </small>

                        <p id="selectedRange" class="mt-2 fw-semibold text-success"></p>
                    </div>


                    <!-- Repeat dropdown -->
                    <div class="mb-3">
                        <label class="form-label" for="repeat">Does this booking repeat?</label>
                        <select class="form-select" id="repeat">
                            <option value="Never">Never</option>
                            <option value="Weekly">Weekly</option>
                            <option value="Monthly">Monthly</option>
                        </select>
                    </div>

                    <!-- Name -->
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter your name">
                    </div>

                    <!-- Purpose -->
                    <div class="mb-3">
                        <label for="purpose" class="form-label">Booking Purpose</label>
                        <input type="text" class="form-control" id="purpose" placeholder="e.g. Study session, group meeting">
                    </div>

                    <!-- Submit -->
                    <button class="btn w-100 text-white" style="background-color: #a3c4a1;">Book Room</button>
                </div>
            </div>

            <!-- Right: Carousel -->
            <div class="col-md-8 d-flex justify-content-end">
                <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="false" style="max-width: 350px;">
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
                    </div>

                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <object data="{{ url_for('static', filename='map_images/DESC_1.svg') }}" 
                                    type="image/svg+xml" 
                                    class="svg-object"
                                    style="max-width: 350px; width: 100%; height: auto;">
                                Your browser does not support SVG
                            </object>
                        </div>
                        <div class="carousel-item">
                            <object data="{{ url_for('static', filename='map_images/DESC_2.svg') }}" 
                                    type="image/svg+xml" 
                                    class="svg-object"
                                    style="max-width: 350px; width: 100%; height: auto;">
                                Your browser does not support SVG
                            </object>
                        </div>
                        <div class="carousel-item">
                            <object data="{{ url_for('static', filename='map_images/DESC_3.svg') }}" 
                                    type="image/svg+xml" 
                                    class="svg-object"
                                    style="max-width: 350px; width: 100%; height: auto;">
                                Your browser does not support SVG
                            </object>
                        </div>
                    </div>

                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>

                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JS links -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/timeSelect.js') }}"></script>
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
</body>
</html>
