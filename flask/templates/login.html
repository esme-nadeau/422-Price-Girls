<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In — CS Room Reservations</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Your existing global site styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body class="bg-light">
  <!-- THIN ACCENT STRIPE -->
  <div class="uo-green-stripe"></div>

  <!-- HEADER BAR MATCHING YOUR EMAIL TEMPLATE -->
  <header class="uo-green-header py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <span class="text-light">UO School of Computer & Data Science</span>
      <span class="text-light">CS Room Reservations</span>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container d-flex align-items-center justify-content-center" style="min-height: 75vh;">
    <div class="card login-card p-4" style="max-width: 420px; width: 100%;">
      <h2 class="h4 text-center mb-1">Welcome Back</h2>
      <p class="text-muted text-center mb-4">Enter your uoregon.edu email to receive a code</p>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email</label>
          <div class="input-group">
            <input id="email" type="email" class="form-control" placeholder="yourname@uoregon.edu" autocomplete="email">
            <button id="requestCodeBtn" class="btn btn-success" type="button">Send Code</button>
          </div>
          <div id="emailError" class="text-danger small mt-2"></div>
        </div>

        <div class="mb-3">
          <label for="code" class="form-label fw-semibold">Verification Code</label>
          <div class="input-group">
            <input id="code" type="text" class="form-control" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code">
            <button id="verifyCodeBtn" class="btn btn-primary" type="button" disabled>Verify Code</button>
          </div>
          <div id="codeError" class="text-danger small mt-2"></div>
        </div>
      </form>

      <div id="loginMsg" class="text-danger small mt-3" style="min-height: 1.25rem;"></div>
      <div id="statusMsg" class="text-success small mt-1" style="min-height: 1.25rem;"></div>

    </div>
  </main>

  <script>
    (function () {
      const emailInput = document.getElementById('email');
      const codeInput = document.getElementById('code');
      const requestBtn = document.getElementById('requestCodeBtn');
      const verifyBtn = document.getElementById('verifyCodeBtn');
      const emailError = document.getElementById('emailError');
      const codeError = document.getElementById('codeError');
      const loginMsg = document.getElementById('loginMsg');
      const statusMsg = document.getElementById('statusMsg');

      const clearMessages = () => {
        emailError.textContent = '';
        codeError.textContent = '';
        loginMsg.textContent = '';
        statusMsg.textContent = '';
      };

      const validateEmail = () => {
        const value = emailInput.value.trim();
        if (!value) {
          emailError.textContent = 'Email is required.';
          return null;
        }
        if (!value.toLowerCase().endsWith('@uoregon.edu')) {
          emailError.textContent = 'Email must end with @uoregon.edu.';
          return null;
        }
        return value;
      };

      requestBtn.addEventListener('click', async () => {
        clearMessages();
        const email = validateEmail();
        if (!email) {
          loginMsg.textContent = 'Missing email or invalid domain.';
          return;
        }

        requestBtn.disabled = true;
        requestBtn.textContent = 'Sending…';
        verifyBtn.disabled = true;

        try {
          const res = await fetch('/auth/request-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json().catch(() => ({}));

          if (!res.ok || data.error) {
            loginMsg.textContent = data.error || 'Unable to send code.';
            return;
          }

          statusMsg.textContent = 'Code sent! Check your inbox.';
          verifyBtn.disabled = false;
          codeInput.focus();
        } catch (err) {
          console.error(err);
          loginMsg.textContent = 'Send failure. Please try again.';
        } finally {
          requestBtn.disabled = false;
          requestBtn.textContent = 'Send Code';
        }
      });

      verifyBtn.addEventListener('click', async () => {
        clearMessages();
        const email = validateEmail();
        if (!email) {
          loginMsg.textContent = 'Missing email or invalid domain.';
          return;
        }
        const code = codeInput.value.trim();
        if (!code) {
          codeError.textContent = 'Enter the verification code.';
          return;
        }

        verifyBtn.disabled = true;
        verifyBtn.textContent = 'Verifying…';

        try {
          const res = await fetch('/auth/verify-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ email, code })
          });
          const data = await res.json().catch(() => ({}));

          if (!res.ok || data.error || data.success === false) {
            loginMsg.textContent = 'Invalid or expired code.';
            return;
          }

          statusMsg.textContent = 'Code verified! Redirecting...';
          console.log('Logged in as', data.email, 'role:', data.role, 'name:', data.name);
          setTimeout(() => {
            window.location.href = '/';
          }, 800);
        } catch (err) {
          console.error(err);
          loginMsg.textContent = 'Invalid or expired code.';
        } finally {
          verifyBtn.disabled = false;
          verifyBtn.textContent = 'Verify Code';
        }
      });
    })();

  </script>
  <script src="{{ url_for('static', filename='js/session-debug.js') }}"></script>

</body>
</html>
