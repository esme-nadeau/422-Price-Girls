<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS Room Reservations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/map.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/mybookings.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/login.css') }}" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <!-- Expose current user's role/login to front-end JS (All Bookings, etc.) -->
  <script>
    window.currentUserRole = "{{ user_role or 'student' }}";
    window.isLoggedIn = {{ 'true' if is_logged_in else 'false' }};
  </script>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</head>

<body>
<header>
  <a href="{{ url_for('login_page') }}" id="login" class="btn btn-outline-danger btn-sm">
    <i class="bi bi-person"></i>
    Login
  </a>
</header>

  

  <section>
    <p style="padding: 0 0 0 30px;">UO School of Computer and Data Science</p>
  </section>

  <main>
    <nav>
      <div class="nav nav-tabs" id="nav-tab" role="tablist">

        <!-- moved to first position AND stays active -->
        <button class="nav-link active" id="nav-allbookings-tab" data-bs-toggle="tab"
          data-bs-target="#nav-allbookings" type="button" role="tab"
          aria-controls="nav-allbookings" aria-selected="true">All Bookings</button>

        <button class="nav-link" id="nav-map-tab" data-bs-toggle="tab" data-bs-target="#nav-map"
          type="button" role="tab" aria-controls="nav-map" aria-selected="false">Map</button>

        <button class="nav-link" id="nav-calendar-tab" data-bs-toggle="tab" data-bs-target="#nav-calendar"
          type="button" role="tab" aria-controls="nav-calendar" aria-selected="false">Calendar</button>

        <button class="nav-link" id="nav-bookings-tab" data-bs-toggle="tab" data-bs-target="#nav-bookings"
          type="button" role="tab" aria-controls="nav-bookings" aria-selected="false">My Bookings</button>

        {% if user_role == 'admin' %}
        <button class="nav-link" id="nav-admin-tab" data-bs-toggle="tab" data-bs-target="#nav-admin"
          type="button" role="tab" aria-controls="nav-admin" aria-selected="false">Admin Tools</button>
        {% endif %}

      </div>
    </nav>

    <div class="tab-content" id="nav-tabContent">

      <!-- moved to first position AND stays active -->
      <div class="tab-pane fade show active p-3" id="nav-allbookings" role="tabpanel"
        aria-labelledby="nav-allbookings-tab"></div>

      <div class="tab-pane fade p-3" id="nav-map" role="tabpanel" aria-labelledby="nav-map-tab"></div>

      <div class="tab-pane fade p-3" id="nav-calendar" role="tabpanel" aria-labelledby="nav-calendar-tab"></div>

      <div class="tab-pane fade p-3" id="nav-bookings" role="tabpanel" aria-labelledby="nav-bookings-tab"></div>

      {% if user_role == 'admin' %}
      <div class="tab-pane fade p-3" id="nav-admin" role="tabpanel" aria-labelledby="nav-admin-tab"></div>
      {% endif %}

    </div>
  </main>

  <footer>
    <signature>
      Created for CS 422, Fall 2025. University of Oregon, All rights reserved.
    </signature>
    <address>
      <p>120 Deschutes Hall</p>
      <p>1202 University of Oregon</p>
      <p>Eugene, OR 97403-1202</p>
      <a href="+1-541-346-4408">541-346-4408</a>
    </address>
  </footer>


  <!-- JS bundles -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/timeSelect.js') }}"></script>
  <script src="{{ url_for('static', filename='js/repeat.js') }}"></script>
  <script src="{{ url_for('static', filename='js/map.js') }}"></script>
  <script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
  <script src="{{ url_for('static', filename='js/allbookings.js') }}"></script>
  <script src="{{ url_for('static', filename='js/bookings.js') }}"></script>
  <script src="{{ url_for('static', filename='js/session-debug.js') }}"></script>
  <script src="{{ url_for('static', filename='js/admin.js') }}"></script>

  <!-- Dynamically load mybookings.js only when tab is shown -->
  <script>
document.addEventListener('DOMContentLoaded', () => {
  const bookingsTab = document.getElementById('nav-bookings-tab');
  const bookingsContent = document.getElementById('nav-bookings');

  bookingsTab.addEventListener('shown.bs.tab', async () => {
    console.log("My Bookings tab opened");

    if (!bookingsContent.dataset.loaded) {
      try {
        const response = await fetch('/mybookings');
        const html = await response.text();
        bookingsContent.innerHTML = html;
        bookingsContent.dataset.loaded = "true";
        console.log("My Bookings HTML loaded");

        // Only load script if not already loaded
        if (!document.querySelector('script[data-loaded="mybookings"]')) {
          const script = document.createElement('script');
          script.src = "{{ url_for('static', filename='js/mybookings.js') }}";
          script.dataset.loaded = "mybookings";
          script.onload = () => {
            console.log("mybookings.js script loaded");
            // Wait a bit for DOM to be ready, then initialize
            setTimeout(() => {
              if (window.bindBookingCardClicks && typeof window.bindBookingCardClicks === 'function') {
                window.bindBookingCardClicks();
              }
              if (window.initMyBookings && typeof window.initMyBookings === 'function') {
                window.initMyBookings();
              }
            }, 50);
          };
          document.body.appendChild(script);
        } else {
          // Script already loaded, just re-bind click handlers
          setTimeout(() => {
            if (window.bindBookingCardClicks && typeof window.bindBookingCardClicks === 'function') {
              window.bindBookingCardClicks();
            }
          }, 50);
        }
      } catch (err) {
        console.error("Failed to load My Bookings:", err);
      }
    } else {
      // Content already loaded, just re-bind click handlers if needed
      if (window.bindBookingCardClicks && typeof window.bindBookingCardClicks === 'function') {
        window.bindBookingCardClicks();
      }
    }
  });
});
</script>

</body>
</html>
